# nginx delante de gunicorn. Sirve HTTPS y deja pasar el resto por proxy.
upstream cv_modista {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name cv-assistant.tereredev.com;

    # certbot escribe acá para validar el dominio
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04) no tiene la directiva `http2 on;` suelta: llegó en 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cv-assistant.tereredev.com;

    ssl_certificate     /etc/letsencrypt/live/cv-assistant.tereredev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv-assistant.tereredev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Los CVs se suben directo a S3 con URL prefirmada, pero el fallback multipart
    # pasa por acá.
    client_max_body_size 12m;

    # Sin cabeceras de seguridad acá: SecurityMiddleware de Django ya manda
    # X-Content-Type-Options, Referrer-Policy, X-Frame-Options y HSTS. Duplicarlas
    # emite el header dos veces.

    location /static/ {
        alias /var/www/cv-modista/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://cv_modista;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto Django cree que la conexión es HTTP y rechaza el CSRF.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Un job puede tardar: el polling es corto pero la subida no siempre.
        proxy_read_timeout 120s;
    }
}
